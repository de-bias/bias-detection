  <rect x="835" y="250" width="310" height="370" fill="#ffffff" stroke="#cfd2d1" rx="5"/>
  <text x="865" y="292" fill="#078481" font-size="14" font-weight="900" letter-spacing="1">THE RESULT</text>
  <text x="865" y="340" fill="#082b55" font-family="'Arial Narrow', 'Roboto Condensed', Arial, sans-serif" font-size="33" font-weight="900" letter-spacing="0" text-anchor="start"><tspan x="865" dy="0">THE SAME AREA</tspan><tspan x="865" dy="34">CAN CHANGE</tspan><tspan x="865" dy="34">POSITION WHEN</tspan><tspan x="865" dy="34">THE SOURCE</tspan><tspan x="865" dy="34">CHANGES.</tspan></text>
  <text x="865" y="540" fill="#304b68" font-family="'Arial Narrow', 'Roboto Condensed', Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="0" text-anchor="start"><tspan x="865" dy="0">One times marks each source’s</tspan><tspan x="865" dy="25">own fitted proportional rate.</tspan></text>
  <circle cx="875" cy="603" r="7" fill="none" stroke="#082b55" stroke-width="2"/>
  <text x="892" y="608" fill="#5f6872" font-size="13">Watford</text>
  <polygon points="987,596 994,603 987,610 980,603" fill="none" stroke="#082b55" stroke-width="2"/>
