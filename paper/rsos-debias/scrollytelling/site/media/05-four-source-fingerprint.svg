  <line x1="55" y1="705" x2="1145" y2="705" stroke="#cfd2d1"/>
  <text x="55" y="734" fill="#304b68" font-family="'Arial Narrow', 'Roboto Condensed', Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" text-anchor="start"><tspan x="55" dy="0">Observed identifiers per resident relative to each source’s own fitted rate. Not a representativeness score or a percentage of residents included.</tspan></text>
  <text x="55" y="770" fill="#5f6872" font-size="12">England and Wales · source numerators and dates differ · 2021 snapshots · released LAD-level dataset</text>
  <text x="1145" y="770" fill="#5f6872" font-size="12" text-anchor="end">Cabrera &amp; Rowe / DEBIAS</text>
</svg>
