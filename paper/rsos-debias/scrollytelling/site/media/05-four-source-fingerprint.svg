<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">The same pair switches sides across four digital sources</title>
  <desc id="description">Watford and North East Derbyshire sit above or below different source-specific fitted proportional rates as the source changes.</desc>
  <rect width="1200" height="800" fill="#fbfaf6"/>
  <style>
    text { font-family: 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
    .caps { font-weight: 900; letter-spacing: 1.2px; }
  </style>
  
  <text x="55" y="55" fill="#082b55" font-size="31" font-weight="900">DEBIAS</text>
  <text x="186" y="52" fill="#5f6872" font-size="14" font-weight="800" letter-spacing="1.1">DATA STORY · ACT II · FOUR-SOURCE FINGERPRINT</text>
  <line x1="55" y1="76" x2="1145" y2="76" stroke="#cfd2d1"/>

  <text x="55" y="142" fill="#082b55" font-family="'Arial Narrow', 'Roboto Condensed', Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="0" text-anchor="start"><tspan x="55" dy="0">THE SAME PAIR</tspan><tspan x="55" dy="50">SWITCHES SIDES.</tspan></text>
  <text x="55" y="225" fill="#304b68" font-family="'Arial Narrow', 'Roboto Condensed', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="0" text-anchor="start"><tspan x="55" dy="0">The places have not changed. The source has.</tspan></text>
  <text x="65" y="258" fill="#078481" font-size="14" font-weight="900" letter-spacing="1">RELATIVE TO EACH SOURCE’S FITTED PROPORTIONAL RATE</text>
  <text x="255" y="281" fill="#5f6872" font-size="13">Fewer than fitted</text>
  <text x="765" y="281" fill="#5f6872" font-size="13" text-anchor="end">More than fitted</text>
  
