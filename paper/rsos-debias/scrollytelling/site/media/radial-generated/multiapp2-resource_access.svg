<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="title-multiapp2-resource_access desc-multiapp2-resource_access">
  <title id="title-multiapp2-resource_access">Multi-app2: Resource accessibility area-context profile</title>
  <desc id="desc-multiapp2-resource_access">A radial profile of within-source relative mean absolute SHAP importance. Zero is the source&#x27;s lowest-scoring feature among 30 and one is its highest; the score gives magnitude, not direction or causality. Features above 0.5: No feature in this group scores above 0.5.</desc>
  <rect width="600" height="560" rx="18" fill="#fbfaf6"/>
  <text x="24" y="30" fill="#5f6872" font-family="Roboto Condensed, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">RELATIVE IMPORTANCE</text>
  <g aria-hidden="true">
    <circle cx="300.0" cy="269.0" r="178.0" fill="none" stroke="#bfc5c4" stroke-width="1.4"/>
    <circle cx="300.0" cy="269.0" r="89.0" fill="none" stroke="#d8d9d5" stroke-width="1.1"/>
    <circle cx="300.0" cy="269.0" r="2.5" fill="none" stroke="#bfc5c4" stroke-width="1.2"/>
    <line x1="300.0" y1="269.0" x2="300.00" y2="91.00" stroke="#d8d9d5" stroke-width="1"/>
    <line x1="300.0" y1="269.0" x2="478.00" y2="269.00" stroke="#d8d9d5" stroke-width="1"/>
    <line x1="300.0" y1="269.0" x2="300.00" y2="447.00" stroke="#d8d9d5" stroke-width="1"/>
    <line x1="300.0" y1="269.0" x2="122.00" y2="269.00" stroke="#d8d9d5" stroke-width="1"/>
    <text x="308.0" y="84.0" fill="#5f6872" font-family="Roboto Condensed, Arial, sans-serif" font-size="12">1</text>
    <text x="308.0" y="173.0" fill="#5f6872" font-family="Roboto Condensed, Arial, sans-serif" font-size="12">0.5</text>
    <text x="308.0" y="283.0" fill="#5f6872" font-family="Roboto Condensed, Arial, sans-serif" font-size="12">0</text>
  </g>
  <polygon points="300.00,224.97 323.92,269.00 300.00,274.33 276.73,269.00" fill="#078481" fill-opacity="0.17" stroke="#078481" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#078481" stroke="#fbfaf6" stroke-width="2">
    <circle cx="300.00" cy="224.97" r="4.3"/>
    <circle cx="323.92" cy="269.00" r="4.3"/>
    <circle cx="300.00" cy="274.33" r="4.3"/>
    <circle cx="276.73" cy="269.00" r="4.3"/>
  </g>
  <text x="300.0" y="535" text-anchor="middle" fill="#304b68" font-family="Roboto Condensed, Arial, sans-serif" font-size="13">0 = lowest of 30 · 1 = highest of 30</text>
</svg>
