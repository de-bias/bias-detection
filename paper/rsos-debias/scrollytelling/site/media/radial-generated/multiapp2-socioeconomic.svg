  <title id="title-multiapp2-socioeconomic">Multi-app2: Socioeconomic area-context profile</title>
  <desc id="desc-multiapp2-socioeconomic">A radial profile of within-source relative mean absolute SHAP importance. Zero is the source&#x27;s lowest-scoring feature among 30 and one is its highest; the score gives magnitude, not direction or causality. Features above 0.5: Population with Level 4 qualifications or above (0.66); Small employers and own-account workers (0.60); Full-time students (0.94); Intermediate occupations (1.00)</desc>
